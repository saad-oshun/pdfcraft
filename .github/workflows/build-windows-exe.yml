          @@ -217,6 +217,29 @@ impl Session {
                   Ok(())
               }
           
          +    /// How many steps Undo can take on document `id` (0 for an unknown or unedited document).
          +    pub fn undo_depth(&self, id: DocId) -> usize {
          +        self.get(id).and_then(|d| d.editor.as_ref()).map_or(0, |e| e.undo.len())
          +    }
          +
          +    /// Join the newest `steps` undo steps into one, so a single Undo takes them all back (the
          +    /// eraser rubs out as it moves, in many small edits, and one stroke undoes as one). The joined
          +    /// step keeps the oldest one's label and state. Fewer than two steps, or more than there are,
          +    /// changes nothing.
          +    pub fn join_undo(&mut self, id: DocId, steps: usize) {
          +        let Ok(doc) = self.doc_mut(id) else { return };
          +        let Some(editor) = doc.editor.as_mut() else { return };
          +        if steps < 2 || steps > editor.undo.len() {
          +            return;
          +        }
          +        let start = editor.undo.len() - steps;
          +        let joined: Vec<_> = editor.undo.drain(start..).collect();
          +        let mut joined = joined.into_iter();
          +        let Some((label, cos, keys, first_scope)) = joined.next() else { return };
          +        let scope = joined.fold(first_scope, |s, step| if s == step.3 { s } else { Scope::Full });
          +        editor.undo.push((label, cos, keys, scope));
          +    }
