          +    let (mut s, id) = session_with(3);
          +    s.apply(id, Edit::RotatePages { pages: vec![0], degrees: 90 }).unwrap();
          +    s.apply(id, Edit::RotatePages { pages: vec![1], degrees: 90 }).unwrap();
          +    s.apply(id, Edit::RotatePages { pages: vec![2], degrees: 90 }).unwrap();
          +    assert_eq!(s.undo_depth(id), 3);
          +    s.join_undo(id, 2);
          +    assert_eq!(s.undo_depth(id), 2);
          +    s.undo(id).unwrap();
          +    let pages = &s.get(id).unwrap().info.pages;
          +    assert_eq!((pages[0].rotation, pages[1].rotation, pages[2].rotation), (90, 0, 0), "the two joined steps undo as one");
